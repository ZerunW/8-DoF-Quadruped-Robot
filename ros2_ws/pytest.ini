[pytest]
# Run from the workspace root. The package sources are put on the path so the tests
# do not need a prior build.
testpaths = src
pythonpath = src/robot_dog_hw src/robot_dog_control
# The auto-loaded ROS launch_testing plugins use a hook signature that pytest >= 9
# removed. These tests do not use launch_testing.
addopts = -p no:cacheprovider -p no:launch_testing -p no:launch_ros
filterwarnings =
    ignore::DeprecationWarning:lark.*
