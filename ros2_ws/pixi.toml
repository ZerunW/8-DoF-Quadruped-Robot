[workspace]
authors = ["Zerun Wang <zerunwang@gatech.edu>"]
channels = ["robostack-humble", "conda-forge"]
name = "robot_dog_control"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[activation]
scripts = ["install/setup.sh"]

[activation.env]
CMAKE_INSTALL_MODE = "SYMLINK"
COLCON_DEFAULT_OUTPUT_STYLE = "catkin_tools"
LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LIBRARY_PATH}"
LD_LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}"
LDFLAGS = "-L${CONDA_PREFIX}/lib -Wl,-rpath,${CONDA_PREFIX}/lib"
RCUTILS_COLORIZED_OUTPUT = "1"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
# DDS on loopback only.
ROS_LOCALHOST_ONLY = "1"

[dependencies]
# Build tools
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
gcc = ">=14.3.0,<15.3"
gxx = ">=14.3.0,<15.3"
cxx-compiler = ">=1.0.0,<2"
python = ">=3.12"
pip = ">=26.1.2,<27"
colcon-common-extensions = ">=0.3.0,<0.4"
setuptools = ">=75,<80"

# ROS 2 Humble, headless
ros-humble-ros-base = ">=0.10.0,<0.11"
ros-humble-bno055 = ">=0.5.0,<0.6"
ros-humble-foxglove-bridge = ">=3.3.0,<4"
ros-humble-teleop-twist-keyboard = ">=2.4.1,<3"
ros-humble-rosbag2 = ">=0.15.16,<0.16"
ros-humble-rosbag2-storage-mcap = ">=0.15.16,<0.16"
ros-humble-xacro = ">=2.0,<3"
ros-humble-joy = ">=3.3.0,<4"

# Algorithms and tests
numpy = ">=2.0,<3"
pyyaml = ">=6.0,<7"
pytest = ">=8.0,<10"

# MuJoCo Python bindings
mujoco-python = ">=3.16,<3.17"

# Deploy terminal
rsync = ">=3.4.4,<4"
openssh = ">=10.2p1,<11"

[pypi-dependencies]
smbus2 = ">=0.6.1, <0.7"
rich = ">=15.0.0, <16"
prompt-toolkit = ">=3.0.52, <4"

[feature.dev.target.linux-64.dependencies]
# Laptop extras (rviz2, rqt): `pixi shell -e dev`
ros-humble-desktop = ">=0.10.0,<0.11"

[environments]
dev = ["dev"]

[tasks]
build = "colcon build --symlink-install --cmake-args -Wno-dev -DBUILD_TESTING=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Release"
clean = "rm -rf build install log"
test  = "python -m pytest src -q"
deploy = "python scripts/deploy.py"

# Launch
launch_driver     = "ros2 launch robot_dog_bringup driver.launch.py"        # servo driver only
launch_bringup    = "ros2 launch robot_dog_bringup bringup.launch.py"       # full robot: stands up and levels
launch_foxglove   = "ros2 launch robot_dog_bringup foxglove.launch.py"      # Foxglove bridge on ws://<host>:8765
launch_teleop     = "ros2 launch robot_dog_bringup teleop.launch.py"        # PS5 gamepad (needs launch_bringup)
launch_sim        = "ros2 launch robot_dog_sim sim.launch.py"               # MuJoCo simulation
launch_sim_viewer = "ros2 launch robot_dog_sim sim.launch.py viewer:=true"
pair_gamepad      = "bash scripts/pair_gamepad.sh"
teleop            = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p speed:=0.05 -p turn:=0.3"
# One-time Pi setup: open the Foxglove port in ufw.
pi_setup          = "sudo -n ufw allow 8765/tcp comment foxglove_bridge && sudo -n ufw status"

# Tools (talk to servo_driver over ROS; need launch_driver or launch_bringup)
servo_tune    = "ros2 run robot_dog_hw servo_tune"
relax         = "ros2 run robot_dog_hw relax"
stand         = "ros2 run robot_dog_hw stand"
imu_check     = "ros2 run robot_dog_hw imu_check"
leg_test      = "ros2 run robot_dog_control leg_test"
calib_offsets = "ros2 run robot_dog_control calib_offsets"

# Simulation
build_mjcf = "python src/robot_dog_sim/scripts/build_mjcf.py"   # URDF -> mjcf/robot_dog.xml
